version: "3.9"

services:
  backend:
    build:
      context: ./api
    container_name: report_backend
    ports:
      - "8000:8000"
    env_file:
      - ./api/.env
    depends_on:
      - mongodb
    volumes:
      - ./api:/app
      - ./uploads:/app/uploads
    restart: always

  frontend:
    build:
      context: ./web_app
    container_name: report_frontend
    ports:
      - "3000:80"
    restart: always
    depends_on:
      - backend

  mongodb:
    image: mongo:6
    container_name: report_mongodb
    volumes:
      - ./mongo_data:/data/db
    ports:
      - "27017:27017"
    restart: always
