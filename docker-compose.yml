services:
  backend:
    build:
      context: ./api
    container_name: report_backend
    ports:
      - "8000:8000"
    env_file:
      - ./api/.env
    depends_on:
      - mongodb
    volumes:
      - ./uploads:/app/uploads

  mongodb:
    image: mongo:6
    container_name: report_mongodb
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

  redis:
    image: redis:alpine
    container_name: report_redis
    ports:
      - "6379:6379"
    restart: always

  celery_worker:
    build:
      context: ./api
    container_name: report_celery_worker
    command: celery -A app.worker.celery_app worker --loglevel=info
    depends_on:
      - redis
      - backend
    environment:
      - REDIS_URL=redis://redis:6379/0
      - MONGODB_URL=mongodb://mongodb:27017
    volumes:
      - ./uploads:/app/uploads

volumes:
  mongo_data:
